<main>
<h1>Contact</h1>
<form action="#" method="post">
  <label for="name">Your Name</label><br>
  <input type="text" id="name" name="name" required><br><br>

  <label for="email">Email</label><br>
  <input type="email" id="email" name="email" required><br><br>
<label for="topic">Topic</label><br>
<select id="topic" name="topic">
  <option value="question">Question</option>
  <option value="feedback">Feedback</option>
  <option value="other">Other</option>
</select><br><br>
<p>How should I reply?</p>
<input type="radio" id="reply-email" name="reply" value="email">
<label for="reply-email">Email</label>
<input type="radio" id="reply-phone" name="reply" value="phone">
<label for="reply-phone">Phone</label><br><br>
  <label for="message">Message</label><br>
  <textarea id="message" name="message" rows="5" cols="40"></textarea><br><br>

<input type="checkbox" id="subscribe" name="subscribe">
<label for="subscribe">Send me updates</label><br><br>
  <button type="submit">Send</button>
</form>
<p>You can reach me at any of these:</p>

<ul>
    <li><a href="https://github.com/jamespat388-web" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    <li><a href="https://mail.google.com/mail/?view=cm&to=jamespat388@gmail.com" target="_blank" rel="noopener noreferrer">Send me an email</a></li>
</ul>
</main>
